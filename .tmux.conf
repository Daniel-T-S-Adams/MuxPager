# ~/.tmux.conf  (symlinked from ~/my-tmux/.tmux.conf)
#
# Self-contained customized tmux setup.
#   * The tmux-agent-status plugin is VENDORED under plugins/ via git subtree,
#     so there is no TPM and no network fetch at startup.
#   * Update the vendored plugin from upstream whenever you want with:
#       git -C ~/my-tmux subtree pull --prefix plugins/tmux-agent-status upstream main --squash
#   * Repo:  https://github.com/Daniel-T-S-Adams/my-tmux

set -g mouse on

# Disable the right-click context menu on panes. tmux's default binds
# MouseDown3Pane to a display-menu whose "Horizontal Split"/"Vertical Split"
# entries split the pane -- unbind it so right-click does nothing.
unbind -T root MouseDown3Pane

# prefix + C -> prompt for a name, then create a new detached session in the
# background (no auto-switch).
# Note: prefix + N is taken by tmux-agent-status (next-done-project).
bind C command-prompt -p "new session name:" "new-session -d -s '%%'"

# Drop the sidebar's INBOX group -- just show the SESSIONS tree. (Custom flag
# added in plugins/.../lib/collect.sh; upstream has no such option.)
set -g @agent-sidebar-inbox off

# --- Make the agent-status sidebar a PERMANENT fixture -----------------------
# The plugin's sidebar.sh is an interactive switcher that exits itself (Enter, q,
# lost tty); with remain-on-exit off the pane is then destroyed -- that's why it
# "disappears". agent-sidebar-ensure.sh recreates the sidebar in whatever window
# you're on if one isn't present, without stealing focus. Hooking it to every
# navigation/creation event makes the sidebar effectively permanent.
#
# Use explicit hook indexes so `source-file ~/.tmux.conf` updates these hooks
# instead of appending duplicates.
set-hook -g after-new-session[90]       "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g after-new-window[90]        "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g after-select-window[90]     "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g session-window-changed[90]  "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g client-session-changed[90]  "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g client-attached[90]         "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"
set-hook -g after-select-pane[90]       "run-shell -b 'sleep 0.2 && ~/my-tmux/scripts/agent-sidebar-ensure.sh'"

# --- Load the vendored tmux-agent-status plugin (replaces TPM) ---------------
# The plugin's entry file self-locates via BASH_SOURCE, so sourcing it directly
# from the repo works exactly like a TPM-managed install.
run-shell '~/my-tmux/plugins/tmux-agent-status/tmux-agent-status.tmux'
