# Portable tmux configuration for this project.
#
# Self-contained customized tmux setup.
#   * The tmux-agent-status plugin is VENDORED under plugins/ via git subtree,
#     so there is no TPM and no network fetch at startup.
#   * Update the vendored plugin from upstream whenever you want with:
#       git -C "$MUXPAGER_ROOT" subtree pull \
#         --prefix plugins/tmux-agent-status upstream main --squash
#   * Repo:  https://github.com/Daniel-T-S-Adams/MuxPager

# `current_file` is the real tracked configuration when loaded through the
# installer-generated ~/.tmux.conf bootstrap. Exporting its directory lets
# hooks and agent processes find this checkout regardless of where it lives.
set-environment -gF MUXPAGER_ROOT "#{d:current_file}"

set -g mouse on

# Disable the right-click context menu on panes. tmux's default binds
# MouseDown3Pane to a display-menu whose "Horizontal Split"/"Vertical Split"
# entries split the pane -- unbind it so right-click does nothing.
unbind -T root MouseDown3Pane

# prefix + C -> choose a nearby Git repository, then name a new detached
# session. The popup starts at the active pane but discovers sibling/nested
# repositories under the directory containing MuxPager, so a MuxPager pane can
# create a worktree for another project such as tig-swarm-demo.
# Accept both uppercase C and Ctrl-c after the prefix. The second form makes the
# shortcut forgiving when Control is still held after pressing Ctrl-b.
# Note: prefix + N is taken by tmux-agent-status (next-done-project).
bind C display-popup -EE -w 80% -h 70% -d '#{pane_current_path}' \
    -T " New Worktree Session " \
    '"$MUXPAGER_ROOT/scripts/new-session-picker.sh"'
bind C-c display-popup -EE -w 80% -h 70% -d '#{pane_current_path}' \
    -T " New Worktree Session " \
    '"$MUXPAGER_ROOT/scripts/new-session-picker.sh"'

# Drop the sidebar's INBOX group -- just show the SESSIONS tree. (Custom flag
# added in plugins/.../lib/collect.sh; upstream has no such option.)
set -g @agent-sidebar-inbox off

# --- Make the agent-status sidebar a PERMANENT fixture -----------------------
# The plugin's sidebar.sh is an interactive switcher that exits itself (Enter, q,
# lost tty); with remain-on-exit off the pane is then destroyed -- that's why it
# "disappears". agent-sidebar-ensure.sh recreates the sidebar in whatever window
# you're on if one isn't present, without stealing focus. Hooking it to every
# navigation/creation event makes the sidebar effectively permanent.
#
# Use explicit hook indexes so `source-file ~/.tmux.conf` updates these hooks
# instead of appending duplicates.
set-hook -g after-new-session[90]       "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g after-new-window[90]        "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g after-select-window[90]     "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g session-window-changed[90]  "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g client-session-changed[90]  "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g client-attached[90]         "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"
set-hook -g after-select-pane[90]       "run-shell -b 'sleep 0.2 && \"#{MUXPAGER_ROOT}/scripts/agent-sidebar-ensure.sh\"'"

# --- Load the vendored tmux-agent-status plugin (replaces TPM) ---------------
# The plugin's entry file self-locates via BASH_SOURCE, so sourcing it directly
# from the repo works exactly like a TPM-managed install.
run-shell '"#{MUXPAGER_ROOT}/plugins/tmux-agent-status/tmux-agent-status.tmux"'
